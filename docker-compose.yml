services:
  db:
    image: postgres:16-alpine
    container_name: careerforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careerforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerforge-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/careerforge
      FRONTEND_URL: http://localhost:8080,http://localhost
      COOKIE_NAME: careerforge_session
      COOKIE_SAME_SITE: lax
      SESSION_DURATION_DAYS: 7
      SESSION_DURATION_DAYS_REMEMBERED: 30
      BCRYPT_ROUNDS: 12
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerforge-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
